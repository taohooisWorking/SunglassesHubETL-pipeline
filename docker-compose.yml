services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: sgh_clickhouse
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-sunglasses_dbt}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: sgh_minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: sgh-airflow:local
    container_name: sgh_airflow
    command: standalone
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    env_file: .env
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"  # local dev only: no login
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: 30            # pick up new DAG files in 30s, not 5min
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scraper:/opt/airflow/project/scraper
      - ./sunglasshut_dbt:/opt/airflow/project/sunglasshut_dbt
    depends_on:
      clickhouse:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  clickhouse_data:
  minio_data:
